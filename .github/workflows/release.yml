name: Build Application and Make Release

on:
  push:
    tags:
      - "*"

permissions: { }

jobs:
  build_release:
    name: Build Release
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      # Required for Azure Trusted Signing
      id-token: write
      # Required for vcpkg binary cache
      packages: write
    with:
      build-type: Release
      environment: Release
      skip-tests: true
    secrets: inherit

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-slim
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "true"
          path: "ZengLauncher-source"
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Grab and store version
        run: |
          tag_name=$(echo ${{ github.ref }} | grep -oE "[^/]+$")
          echo "VERSION=$tag_name" >> $GITHUB_ENV
      - name: Package artifacts properly
        run: |
          mv ${{ github.workspace }}/ZengLauncher-source ZengLauncher-${{ env.VERSION }}
          mv ZengLauncher-Linux-Qt6-Portable*/ZengLauncher-portable.tar.gz ZengLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ZengLauncher-Linux-aarch64-Qt6-Portable*/ZengLauncher-portable.tar.gz ZengLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
          mv ZengLauncher-*.AppImage/ZengLauncher-*-x86_64.AppImage ZengLauncher-Linux-x86_64.AppImage
          mv ZengLauncher-*.AppImage.zsync/ZengLauncher-*-x86_64.AppImage.zsync ZengLauncher-Linux-x86_64.AppImage.zsync
          mv ZengLauncher-*.AppImage/ZengLauncher-*-aarch64.AppImage ZengLauncher-Linux-aarch64.AppImage
          mv ZengLauncher-*.AppImage.zsync/ZengLauncher-*-aarch64.AppImage.zsync ZengLauncher-Linux-aarch64.AppImage.zsync
          mv ZengLauncher-macOS*/ZengLauncher.zip ZengLauncher-macOS-${{ env.VERSION }}.zip
          mv ZengLauncher-macOS*/ZengLauncher.dmg ZengLauncher-macOS-${{ env.VERSION }}.dmg

          tar --exclude='.git' -czf ZengLauncher-${{ env.VERSION }}.tar.gz ZengLauncher-${{ env.VERSION }}

          for d in ZengLauncher-Windows-MSVC*; do
            cd "${d}" || continue
            LEGACY="$(echo -n ${d} | grep -o Legacy || true)"
            ARM64="$(echo -n ${d} | grep -o arm64 || true)"
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ZengLauncher-Windows-MSVC"
            test -z "${LEGACY}" || NAME="${NAME}-Legacy"
            test -z "${ARM64}" || NAME="${NAME}-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ZengLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ZengLauncher-Windows-MinGW-w64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ZengLauncher-Windows-MinGW-w64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ZengLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

          for d in ZengLauncher-Windows-MinGW-arm64*; do
            cd "${d}" || continue
            INST="$(echo -n ${d} | grep -o Setup || true)"
            PORT="$(echo -n ${d} | grep -o Portable || true)"
            NAME="ZengLauncher-Windows-MinGW-arm64"
            test -z "${PORT}" || NAME="${NAME}-Portable"
            test -z "${INST}" || mv ZengLauncher-*.exe ../${NAME}-Setup-${{ env.VERSION }}.exe
            test -n "${INST}" || zip -r -9 "../${NAME}-${{ env.VERSION }}.zip" *
            cd ..
          done

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ZengLauncher ${{ env.VERSION }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            ZengLauncher-Linux-x86_64.AppImage
            ZengLauncher-Linux-x86_64.AppImage.zsync
            ZengLauncher-Linux-aarch64.AppImage
            ZengLauncher-Linux-aarch64.AppImage.zsync
            ZengLauncher-Linux-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ZengLauncher-Linux-aarch64-Qt6-Portable-${{ env.VERSION }}.tar.gz
            ZengLauncher-Windows-MinGW-w64-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MinGW-w64-Portable-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MinGW-w64-Setup-${{ env.VERSION }}.exe
            ZengLauncher-Windows-MinGW-arm64-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MinGW-arm64-Portable-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MinGW-arm64-Setup-${{ env.VERSION }}.exe
            ZengLauncher-Windows-MSVC-arm64-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MSVC-arm64-Portable-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MSVC-arm64-Setup-${{ env.VERSION }}.exe
            ZengLauncher-Windows-MSVC-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MSVC-Portable-${{ env.VERSION }}.zip
            ZengLauncher-Windows-MSVC-Setup-${{ env.VERSION }}.exe
            ZengLauncher-macOS-${{ env.VERSION }}.zip
            ZengLauncher-macOS-${{ env.VERSION }}.dmg
            ZengLauncher-${{ env.VERSION }}.tar.gz
