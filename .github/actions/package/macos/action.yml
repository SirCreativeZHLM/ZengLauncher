name: Package for macOS
description: Create a macOS package for ZengLauncher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: macOS
  apple-codesign-cert:
    description: Certificate for signing macOS builds
    required: false
  apple-codesign-password:
    description: Password for signing macOS builds
    required: false
  apple-codesign-id:
    description: Certificate ID for signing macOS builds
    required: false
  apple-notarize-apple-id:
    description: Apple ID used for notarizing macOS builds
    required: false
  apple-notarize-team-id:
    description: Team ID used for notarizing macOS builds
    required: false
  apple-notarize-password:
    description: Password used for notarizing macOS builds
    required: false
  sparkle-ed25519-key:
    description: Private key for signing Sparkle updates
    required: false

runs:
  using: composite

  steps:
    - name: Fetch codesign certificate
      shell: bash
      env:
        APPLE_CODESIGN_CERT: ${{ inputs.apple-codesign-cert }}
        APPLE_CODESIGN_PASSWORD: ${{ inputs.apple-codesign-password }}
        APPLE_CODESIGN_ID: ${{ inputs.apple-codesign-id }}
      run: |
        if [ -n "$APPLE_CODESIGN_ID" ]; then
          printf '%s' "$APPLE_CODESIGN_CERT" | base64 --decode > codesign.p12
          security create-keychain -p "$APPLE_CODESIGN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_CODESIGN_PASSWORD" build.keychain
          security import codesign.p12 -k build.keychain -P "$APPLE_CODESIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CODESIGN_PASSWORD" build.keychain
        else
          echo ":warning: Using ad-hoc code signing for macOS, as certificate was not present." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        INSTALL_DIR: install
        APPLE_CODESIGN_ID: ${{ inputs.apple-codesign-id }}
      run: |
        cmake --install ${{ env.BUILD_DIR }} --config ${{ inputs.build-type }}

        cd ${{ env.INSTALL_DIR }}
        APP="ZengLauncher.app"
        chmod +x "$APP/Contents/MacOS/zenglauncher"
        ICON_FILE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$APP/Contents/Info.plist")
        test -s "$APP/Contents/Resources/$ICON_FILE" || test -s "$APP/Contents/Resources/$ICON_FILE.icns"

        if [ -n "$APPLE_CODESIGN_ID" ]; then
          ENTITLEMENTS_FILE='../program_info/App.entitlements'
        else
          ENTITLEMENTS_FILE='../program_info/AdhocSignedApp.entitlements'
          APPLE_CODESIGN_ID='-'
        fi

        codesign --sign "$APPLE_CODESIGN_ID" --deep --force --entitlements "$ENTITLEMENTS_FILE" --options runtime "$APP"
        codesign --verify --deep --strict --verbose=2 "$APP"

    - name: Notarize
      shell: bash
      env:
        INSTALL_DIR: install
        APPLE_NOTARIZE_APPLE_ID: ${{ inputs.apple-notarize-apple-id }}
        APPLE_NOTARIZE_TEAM_ID: ${{ inputs.apple-notarize-team-id }}
        APPLE_NOTARIZE_PASSWORD: ${{ inputs.apple-notarize-password }}
      run: |
        cd ${{ env.INSTALL_DIR }}

        if [ -n "$APPLE_NOTARIZE_PASSWORD" ]; then
          ditto -c -k --sequesterRsrc --keepParent "ZengLauncher.app" ../ZengLauncher.zip
          xcrun notarytool submit ../ZengLauncher.zip \
            --wait --progress \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD"

          xcrun stapler staple "ZengLauncher.app"
          xcrun stapler validate "ZengLauncher.app"
          spctl --assess --type execute --verbose=2 "ZengLauncher.app"
        else
          echo ":warning: Skipping notarization as credentials are not present." >> $GITHUB_STEP_SUMMARY
        fi
        ditto -c -k --sequesterRsrc --keepParent "ZengLauncher.app" ../ZengLauncher.zip

    - name: Create DMG
      shell: bash
      env:
        INSTALL_DIR: install
      run: |
        cd ${{ env.INSTALL_DIR }}

        mkdir -p src
        cp -R "ZengLauncher.app" src/

        ln -s /Applications src/

        hdiutil create \
            -volname "ZengLauncher ${{ inputs.version }}" \
            -srcfolder src \
            -ov -format ULMO \
            "../ZengLauncher.dmg"

    - name: Make Sparkle signature
      shell: bash
      run: |
        if [ '${{ inputs.sparkle-ed25519-key }}' != '' ]; then
          echo '${{ inputs.sparkle-ed25519-key }}' > ed25519-priv.pem
          signature_zip=$(/opt/homebrew/opt/openssl@3/bin/openssl pkeyutl -sign -rawin -in ${{ github.workspace }}/ZengLauncher.zip -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          signature_dmg=$(/opt/homebrew/opt/openssl@3/bin/openssl pkeyutl -sign -rawin -in ${{ github.workspace }}/ZengLauncher.dmg -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          rm ed25519-priv.pem
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :memo: Sparkle Signature (ed25519): \`$signature_zip\` (ZIP)
        - :memo: Sparkle Signature (ed25519): \`$signature_dmg\` (DMG)
        EOF
        else
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :warning: Sparkle Signature (ed25519): No private key available (likely a pull request or fork)
        EOF
        fi

    - name: Upload binary tarball
      uses: actions/upload-artifact@v7
      with:
        name: ZengLauncher-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: ZengLauncher.zip

    - name: Upload disk image
      uses: actions/upload-artifact@v7
      with:
        name: ZengLauncher-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}.dmg
        path: ZengLauncher.dmg
